<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Tests & Shops</title><style>
:root{font-family:Inter,ui-sans-serif,system-ui,-apple-system,Segoe UI,sans-serif;color:#27314a}*{box-sizing:border-box}body{margin:0;min-height:100vh;background:radial-gradient(ellipse at 8% 12%,#fff3b9 0,transparent 42%),radial-gradient(ellipse at 91% 10%,#ffd9e8 0,transparent 43%),radial-gradient(ellipse at 16% 85%,#c9f6d7 0,transparent 45%),radial-gradient(ellipse at 92% 83%,#ccecff 0,transparent 48%),#fffdf7;background-attachment:fixed}.page{max-width:1500px;margin:auto;padding:54px 24px 75px}.intro{text-align:center;margin:0 auto 36px}.intro h1{font-size:clamp(2.2rem,5vw,4.1rem);font-weight:950;letter-spacing:-.065em;line-height:1.12;margin:0;background:linear-gradient(100deg,#fa5879 12%,#9264e7 42%,#28adad 73%,#f4a23d);background-clip:text;-webkit-background-clip:text;color:transparent}.intro p{color:#657188;margin:13px 0 0;font-weight:550;font-size:1rem}.layout{display:grid;grid-template-columns:2fr 5fr;gap:20px;align-items:start}.group{border-radius:30px;padding:18px;box-shadow:0 12px 35px rgba(61,74,105,.085);border:1px solid rgba(255,255,255,.8)}.tests{background:linear-gradient(135deg,#ffb9bc,#ffd4c6)}.shops{background:linear-gradient(135deg,#baf4df,#bceff0)}.group-title{margin:0 0 16px;text-align:center;padding:13px 20px;border-radius:19px;font-size:clamp(1.3rem,2.1vw,2rem);letter-spacing:.07em;font-weight:950;color:white;text-shadow:0 2px 5px #00000012}.tests .group-title{background:linear-gradient(110deg,#f56475,#ed8a72)}.shops .group-title{background:linear-gradient(110deg,#3cc7a3,#46b5d3)}.columns{display:grid;gap:11px}.tests .columns{grid-template-columns:repeat(2,minmax(0,1fr))}.shops .columns{grid-template-columns:repeat(5,minmax(0,1fr))}.panel{min-width:0;padding:15px 10px 18px;border-radius:23px;background:rgba(255,255,255,.67);border:1px solid rgba(255,255,255,.85);box-shadow:0 5px 16px rgba(45,65,90,.045);text-align:center}.panel h2{font-size:clamp(.8rem,1.15vw,1.12rem);line-height:1.25;font-weight:850;min-height:48px;display:flex;align-items:center;justify-content:center;margin:0 0 13px;letter-spacing:-.025em;color:#35445b}.price-list{display:grid;gap:10px}.price{width:100%;min-height:43px;display:flex;align-items:center;justify-content:center;border-radius:999px;text-decoration:none;font-size:clamp(.78rem,1.1vw,1rem);font-weight:850;letter-spacing:.01em;color:#24324a;box-shadow:0 4px 9px rgba(48,61,84,.07),inset 0 1px 0 #ffffff80;transition:transform .18s,box-shadow .18s;outline-offset:3px}.price:hover{transform:translateY(-2px);box-shadow:0 8px 15px rgba(48,61,84,.13)}.price:focus-visible{outline:3px solid #6e70e8}.price[data-tier="0"]{background:#ffe67b}.price[data-tier="1"]{background:#ffa8b4}.price[data-tier="2"]{background:#9ce8ed}.price[data-tier="3"]{background:#c3b4ff}.price[data-tier="4"]{background:#a8e4ae}.price[data-tier="5"]{background:#ffd5a3}.price[data-tier="6"]{background:#f5b8e7}.price[data-tier="7"]{background:#9cc9ff}.price[data-tier="8"]{background:#c8eda3}.price[data-tier="9"]{background:#ffe3a0}.foot{text-align:center;color:#7d889b;font-size:.83rem;margin-top:26px}@media(max-width:1050px){.layout{grid-template-columns:1fr}.shops .columns{grid-template-columns:repeat(5,minmax(0,1fr))}.panel h2{font-size:1rem}}@media(max-width:650px){.page{padding:35px 12px 45px}.group{padding:11px;border-radius:23px}.columns{gap:8px}.panel{padding:12px 7px;border-radius:17px}.shops .columns{grid-template-columns:repeat(2,minmax(0,1fr))}.shops .panel:last-child{grid-column:1/-1}.panel h2{min-height:40px;font-size:.88rem}.price{min-height:40px;font-size:.86rem}.group-title{margin-bottom:11px}}
/* Inset scale pulse stays inside the heading boundary. */
.group-title{animation:gentlePulse 2.4s ease-in-out infinite;will-change:transform}
@keyframes gentlePulse{0%,100%{transform:scale(1)}50%{transform:scale(.955)}}
@media(prefers-reduced-motion:reduce){.group-title{animation:none}}
/* Individually varied, moderately bold TEST button shades; SHOP colors unchanged. */
.tests .price[data-tier="0"]{background:#7755D8;color:#fff;text-shadow:0 1px 2px #00000020}
.tests .price[data-tier="1"]{background:#C15D9C;color:#fff;text-shadow:0 1px 2px #00000020}
.tests .price[data-tier="2"]{background:#4D83C9;color:#fff;text-shadow:0 1px 2px #00000020}
.tests .price[data-tier="3"]{background:#B36B4B;color:#fff;text-shadow:0 1px 2px #00000020}
.tests .price[data-tier="4"]{background:#6577CB;color:#fff;text-shadow:0 1px 2px #00000020}
.tests .price[data-tier="5"]{background:#A34EAF;color:#fff;text-shadow:0 1px 2px #00000020}
.tests .price[data-tier="6"]{background:#368C91;color:#fff;text-shadow:0 1px 2px #00000020}
.tests .price[data-tier="7"]{background:#D16A77;color:#fff;text-shadow:0 1px 2px #00000020}
.tests .price[data-tier="8"]{background:#6D69B7;color:#fff;text-shadow:0 1px 2px #00000020}
.tests .price[data-tier="9"]{background:#B67D3F;color:#fff;text-shadow:0 1px 2px #00000020}
/* Softer, fuller shadows on every price button. */
.price{box-shadow:0 8px 20px rgba(51,63,96,.16),0 3px 8px rgba(51,63,96,.08),inset 0 1px 0 #ffffff65}
.price:hover{box-shadow:0 12px 26px rgba(51,63,96,.2),0 4px 12px rgba(51,63,96,.09)}
</style><style>
.verify-overlay{position:fixed;inset:0;background:#27314a88;display:none;align-items:center;justify-content:center;padding:18px;z-index:50}.verify-overlay.active{display:flex}.verify-box{width:min(100%,440px);background:#fffdf9;border-radius:25px;padding:26px;box-shadow:0 20px 70px #27314a55}.verify-box h2{margin:0 0 8px}.verify-box p{color:#59657b}.verify-box label{display:block;margin-top:13px;font-weight:700}.verify-box input{width:100%;padding:12px;border:1px solid #aab5c8;border-radius:12px;margin-top:5px;font:inherit}.verify-actions{display:flex;gap:12px;margin-top:20px}.verify-actions button,.verify-checkout{border:0;border-radius:20px;padding:12px 18px;cursor:pointer;font:inherit;font-weight:800}.verify-actions button:first-child{background:#e7eaf1}.verify-actions button:last-child{background:#a8e4ae}.verify-error{color:#a12b45!important;min-height:20px}.verify-checkout{display:none;text-decoration:none;text-align:center;color:#24324a;width:100%;margin-top:14px}
 .card-note{display:block;margin-top:7px;font-size:.75rem;color:#657188;line-height:1.4}</style></head><body><main class="page"><header class="intro"><h1>Explore & Choose</h1><p>Simple choices. Bright possibilities.</p></header><div class="layout"><section class="group tests" aria-labelledby="test-heading"><h2 class="group-title" id="test-heading">TEST</h2><div class="columns" id="test-columns"></div></section><section class="group shops" aria-labelledby="shops-heading"><h2 class="group-title" id="shops-heading">SHOPS</h2><div class="columns" id="shop-columns"></div></section></div><p class="foot">Choose an amount to continue</p></main><script>
/* EDIT PAYMENT LINKS HERE. Each entry has its own link. Replace '#' with a full checkout URL. */
const links = {
  xoxoGen: [
    'https://whop.com/checkout/plan_VPnstlycDJ6Z1',
    'https://whop.com/checkout/plan_VKZ66rHCjVops',
    'https://whop.com/checkout/plan_88olfvmphcyOo',
    'https://whop.com/checkout/plan_QN9Guglt0wrN2',
    'https://whop.com/checkout/plan_B8HLWdx0NRSFR',
    'https://whop.com/checkout/plan_CvMd4rG7Tg24h',
    'https://whop.com/checkout/plan_HBFjIjFIu65M3',
    'https://whop.com/checkout/plan_DAIkV5KAs5ndc',
    'https://whop.com/checkout/plan_Wwh34uGsyEWgz',
    'https://whop.com/checkout/plan_gKvCSe4OHrh40'
  ],
  toronoMasters: [
    'https://whop.com/checkout/plan_DCVFcoiI26VPE',
    'https://whop.com/checkout/plan_avCcNiykz1aEE',
    'https://whop.com/checkout/plan_ZLLyX3nfHmg9b',
    'https://whop.com/checkout/plan_zQ79VDOcinhY5',
    'https://whop.com/checkout/plan_4thO41qVDiaj6',
    'https://whop.com/checkout/plan_LKKd759xbEohW',
    'https://whop.com/checkout/plan_dJhBbMBR4t4ci',
    'https://whop.com/checkout/plan_Ax6jzhLKC9NGe',
    'https://whop.com/checkout/plan_UdMrvLNbpq0GB',
    'https://whop.com/checkout/plan_p2POjhDmYiMbA'
  ],
  getLifeUpdate: Array(10).fill('#'),
  eduSparkUp: Array(10).fill('#'),
  digitalAdventures: Array(10).fill('#'),
  skill0Zen: Array(10).fill('#'),
  softGetSkills: Array(10).fill('#')
};
const testPrices = ['$1.00','$1.10','$1.20','$1.30','$1.40','$1.50','$1.60','$1.70','$1.80','$1.90'];
const shopPrices = {
  getLifeUpdate: [100,200,300,400,500,600,700,800,900,1000],
  eduSparkUp: [120,220,320,420,520,620,720,820,920,990],
  digitalAdventures: [101,201,301,401,501,601,701,801,901,991],
  skill0Zen: [125,225,325,425,525,625,725,825,925,975],
  softGetSkills: [145,245,345,445,545,645,745,845,945,999]
};
const testSections=[['Xoxo Gen','xoxoGen'],['Torono Masters','toronoMasters']];
const shopSections=[['Get Life Update','getLifeUpdate'],['Edu Spark Up','eduSparkUp'],['Digital Adventures','digitalAdventures'],['Skill 0 Zen','skill0Zen'],['Soft Get Skills','softGetSkills']];
function render(target,sections,prices){const parent=document.getElementById(target);sections.forEach(([name,key])=>{const panel=document.createElement('article');panel.className='panel';const title=document.createElement('h2');title.textContent=name;panel.append(title);const list=document.createElement('div');list.className='price-list';(Array.isArray(prices) ? prices : prices[key]).forEach((amount,i)=>{const price=typeof amount==='number'?'$'+amount.toLocaleString('en-US'):amount;const a=document.createElement('a');a.className='price';a.dataset.tier=i;a.textContent=price;a.href=links[key]?.[i]||'#';if(a.href.endsWith('#')){a.addEventListener('click',e=>e.preventDefault());a.title='Add your payment link in index.html';}else{a.target='_blank';a.rel='noopener noreferrer';}a.setAttribute('aria-label',name+' — '+price+' (button '+(i+1)+')');list.append(a)});panel.append(list);parent.append(panel)})}
render('test-columns',testSections,testPrices);render('shop-columns',shopSections,shopPrices);
</script><div id="verify-overlay" class="verify-overlay" role="dialog" aria-modal="true" aria-labelledby="verify-title"><div class="verify-box"><h2 id="verify-title">Verify your details</h2><p id="verify-description">Enter your email and your 14–16 digit ID Number to continue.</p><form id="verify-form"><label>Email<input id="verify-email" type="email" autocomplete="email" required maxlength="254"></label><label>ID Number<input id="verify-test" type="text" required minlength="14" maxlength="16" placeholder="Enter 14–16 digits" pattern="[0-9]{14,16}" title="Enter 14 to 16 digits only" autocomplete="off" inputmode="numeric"></label><p id="verify-message" class="verify-error" role="status" aria-live="polite"></p><div class="verify-actions"><button type="button" id="verify-cancel">Cancel</button><button type="submit" id="verify-submit">Verify</button></div></form><a id="verify-checkout" class="verify-checkout" target="_blank" rel="noopener noreferrer">Continue to checkout</a></div></div><script>
(()=>{const overlay=document.getElementById('verify-overlay'),form=document.getElementById('verify-form'),msg=document.getElementById('verify-message'),checkout=document.getElementById('verify-checkout'),submit=document.getElementById('verify-submit');let selected=null;document.querySelectorAll('.panel .price').forEach(a=>{a.addEventListener('click',e=>{e.preventDefault();const panel=a.closest('.panel'),title=panel.querySelector('h2').textContent;selected={shop: title, url:a.getAttribute('href'),amount:a.textContent,style:getComputedStyle(a).backgroundColor,color:getComputedStyle(a).color};form.reset();form.style.display='block';checkout.style.display='none';msg.textContent='';overlay.classList.add('active');document.getElementById('verify-title').textContent=title+' — '+selected.amount;document.getElementById('verify-email').focus();});});function close(){overlay.classList.remove('active')}document.getElementById('verify-cancel').onclick=close;overlay.addEventListener('click',e=>{if(e.target===overlay)close()});document.addEventListener('keydown',e=>{if(e.key==='Escape')close()});form.addEventListener('submit',async e=>{e.preventDefault();if(!selected)return;submit.disabled=true;msg.textContent='Checking…';try{const r=await fetch('/.netlify/functions/verify',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({shop_name:selected.shop,email:document.getElementById('verify-email').value,id_number:document.getElementById('verify-test').value,price:selected.amount})});const data=await r.json();if(!r.ok){msg.textContent=data.error||'Verification failed. Try again.';return;}form.style.display='none';checkout.style.display='block';checkout.textContent=selected.amount;checkout.style.background=selected.style;checkout.style.color=selected.color;if(!selected.url||selected.url==='#'){checkout.removeAttribute('href');checkout.textContent='Checkout link not configured';checkout.style.pointerEvents='none'}else{checkout.href=selected.url;checkout.style.pointerEvents='auto'}}catch(err){msg.textContent='Connection unavailable. Please try again.'}finally{submit.disabled=false}})})();
</script></body></html>
